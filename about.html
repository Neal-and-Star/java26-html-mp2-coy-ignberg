<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us - Timeline</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="about-container">
        
        <div class="timeline-nav">
            <div class="timeline-line"></div>
            
            <button class="timeline-node active" data-year="2006">2006</button>
            
            <button class="timeline-node" data-year="2016">2016</button>

            <button class="timeline-node" data-year="2026">2026</button>

        </div>

        <div class="timeline-content">
            
            <div class="content-left">
                <div class="image-wrapper">
                    <img src="https://placeholder.com" alt="Our Beginnings" id="history-image">
                </div>
            </div>

            <div class="content-right">
                <h2 id="history-title">Pizzeria Dalhem</h2>
                <p id="history-text">
                    Pizzeria Dalhem är ett familjeföretag och slog upp dörrarna för tio år sedan. Idag tio år senare bedriver vi denna verksamhet fortfarande och det blev en lyckad succé. Hemligheten bakom vår framgångs recept bygger på god kvalité, fina råvaror och en bra pizza botten.
                </p>
            </div>

        </div>

    </section>

</body>
</html>
